# Sobreposição de desenvolvimento, sem GPU:
#   docker compose -p avatar-dev -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.dev.yml up -d --build --wait
# Publica a api só em 127.0.0.1 e troca o worker pelo alvo supervisor-cpu, sem GPU, com os
# pesos em models/ na raiz do repositório. Os valores padrão abaixo servem apenas para
# desenvolvimento.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar-dev}

  api:
    environment:
      DATABASE_URL: postgresql://avatar:${POSTGRES_PASSWORD:-avatar-dev}@postgres:5432/avatar
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token}
      APP_ENV: development
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    build:
      target: supervisor-cpu
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token}
    volumes:
      - ${MODELS_DIR:-../../models}:/models:ro
    deploy: !reset {}
