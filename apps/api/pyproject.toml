[project]
name = "avatar-api"
version = "0.1.0"
description = "API de geração de vídeos com avatar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "uvicorn[standard]==0.54.0",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
]

[project.scripts]
avatar-api = "avatar_api.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.alembic]
script_location = "migrations"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
