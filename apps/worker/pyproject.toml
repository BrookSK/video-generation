[project]
name = "avatar-worker"
version = "0.1.0"
description = "Worker de geração de vídeos com avatar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pillow==12.3.0",
    "rembg[cpu]==2.0.85",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: exige o servidor GPU do cliente com /models",
]
