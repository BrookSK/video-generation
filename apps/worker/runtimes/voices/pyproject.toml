[project]
name = "avatar-voices-runtime"
version = "0.1.0"
description = "Runtime isolado da ferramenta offline de referências de voz (Kokoro-82M pt-BR em CPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Código na revisão do componente kokoro-code do manifesto.
    "kokoro",
    "torch==2.6.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Data de corte logo depois do commit fixado do kokoro (2025-08-06): transformers,
# huggingface_hub e numpy não passam das versões com que esse código foi publicado.
exclude-newer = "2025-08-07T00:00:00Z"

[tool.uv.sources]
kokoro = { git = "https://github.com/hexgrad/kokoro", rev = "dfb907a02bba8152ca444717ca5d78747ccb4bec" }
# No Linux, a wheel CPU do índice do PyTorch; no macOS, a wheel do PyPI já é só CPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
extend = "../../pyproject.toml"
